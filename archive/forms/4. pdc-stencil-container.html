<div class="pdc-auth-container" id="pdc-auth-container"
     role="region" aria-label="PDC Integration">

  <!-- Field mapping from Ruby method, Base64-encoded JSON.
       The Liquid tag calls the server-side method at render time.
       JS decodes it once and caches the parsed result. -->
  {% assign mapping_data = model.PDC_Get_PDC_Field_Mapping %}
  <div id="pdc-field-mappings" class="hidden"
       data-field-mappings="{{ mapping_data }}"
       aria-hidden="true"></div>

  <!-- ── Login section (shown when not authenticated) ── -->
  <div id="pdc-login-container" role="group" aria-label="PDC authentication">
    <button id="pdc-login-btn" class="pdc-button" type="button"
            aria-describedby="pdc-login-desc">
      Log in to PDC
    </button>
    <span id="pdc-login-desc" class="sr-only">
      Opens a popup window to authenticate with the Philanthropy Data Commons
    </span>
  </div>

  <!-- ── Authenticated section (shown when authenticated) ── -->
  <div id="pdc-authenticated-container" class="hidden"
       role="group" aria-label="PDC session">
    <div class="pdc-user-info" role="status" aria-live="polite" aria-atomic="true">
      <div>Connected as: <strong id="pdc-user-name"></strong></div>
      <div id="pdc-user-email"></div>
    </div>
    <br>
    <button id="pdc-launch-btn" class="pdc-button" type="button"
            aria-describedby="pdc-launch-desc">
      Launch PDC Data Explorer
    </button>
    <span id="pdc-launch-desc" class="sr-only">
      Fetches your data from PDC and opens the explorer panel
    </span>
    <button id="pdc-logout-btn" class="pdc-button" type="button">
      Log out from PDC
    </button>
  </div>

  <!-- Floating panel: tabindex="-1" allows programmatic focus
       without adding it to the natural tab order -->
  <div class="pdc-floating-panel hidden" id="pdcProposalsPanel"
       tabindex="-1"
       role="dialog" aria-labelledby="pdcPanelTitle" aria-modal="false"
       aria-describedby="pdcPanelDesc">

    <div class="pdc-panel-header" id="pdcPanelHeader">
      <h2 id="pdcPanelTitle">PDC Data Explorer</h2>
      <span id="pdcPanelDesc" class="sr-only">
        Drag field values from proposals onto the form to populate fields
      </span>
      <div class="pdc-panel-controls">
        <button id="closeBtn" type="button"
                title="Close" aria-label="Close panel">&times;</button>
      </div>
    </div>

    <div class="pdc-panel-search">
      <label for="searchInput" class="sr-only">Search PDC Data</label>
      <input type="search" id="searchInput"
             aria-label="Search proposals by opportunity or funder name"
             placeholder="Search by opportunity or funder..."
             autocomplete="off">
    </div>

    <div class="pdc-panel-body" id="panelBody"
         role="list" aria-label="Proposal entries"
         aria-live="polite">
    </div>
  </div>

  <!-- Drag ghost (positioned offscreen, moved by drag handler) -->
  <div class="pdc-drag-ghost" id="dragGhost" aria-hidden="true"></div>

  <!-- Live region for status announcements (loading, errors) -->
  <div id="pdc-status" class="sr-only"
       role="status" aria-live="polite" aria-atomic="true"></div>
  <img style="display:none" src="/images/fluxx_engine/theme/default/icons/sitemap.png" onload="window._pdcStructureReady=true;" alt="">
</div>
